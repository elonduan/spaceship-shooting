<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ball Shooter — Leaderboard Edition</title>
  <style>
    html,body {
      height:100%; margin:0; background:#000; color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      overflow:hidden;
    }
    canvas { display:block; width:100%; height:100%; background:#000; }

    /* ===== Popup Overlay ===== */
    #namePopup {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      z-index: 1000;
    }
    #popupBox {
      background: #111;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      text-align: center;
    }
    #popupBox input {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      width: 200px;
      text-align: center;
      font-size: 15px;
    }
    #popupBox button {
      margin-top: 10px;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #28a745;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    /* ===== Leaderboard ===== */
    #leaderboard {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #ffd700;
      max-width: 200px;
    }
    #leaderboardList {
      margin-top: 4px;
      padding-left: 18px;
      color: #fff;
      font-weight: 400;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- ===== Leaderboard Panel ===== -->
  <div id="leaderboard">
    <div>Leaderboard:</div>
    <ol id="leaderboardList"></ol>
  </div>

  <!-- ===== Popup for Name Entry ===== -->
  <div id="namePopup">
    <div id="popupBox">
      <h3>Enter your name to start</h3>
      <input type="text" id="playerNameInput" placeholder="Your name" maxlength="20" />
      <br />
      <button id="startBtn">Start Game</button>
    </div>
  </div>

  <!-- ===== Canvas for your game ===== -->
  <canvas id="gameCanvas"></canvas>

  <script>
    const SHEET_API_URL = "https://api.sheetbest.com/sheets/eab9fbde-78f6-4bcb-bb78-a557cbd672fa";
    let playerName = null;

    /*********************** Leaderboard Fetch & Display *************************/
    async function loadLeaderboard() {
      try {
        const response = await fetch(SHEET_API_URL);
        const data = await response.json();

        const sorted = data
          .filter(row => row.Name && row.BestScore)
          .map(row => ({
            name: row.Name.trim(),
            score: parseFloat(row.BestScore)
          }))
          .filter(row => !isNaN(row.score))
          .sort((a, b) => b.score - a.score);

        const topN = sorted.slice(0, 10);
        const list = document.getElementById('leaderboardList');
        list.innerHTML = '';

        if (topN.length === 0) {
          list.innerHTML = '<li>No scores yet</li>';
        } else {
          topN.forEach((entry, index) => {
            const li = document.createElement('li');
            li.textContent = `${entry.name} — ${entry.score}`;
            if (index === 0) li.style.color = '#ffd700';
            else if (index === 1) li.style.color = '#c0c0c0';
            else if (index === 2) li.style.color = '#cd7f32';
            list.appendChild(li);
          });
        }
      } catch (err) {
        console.error('Leaderboard load failed:', err);
      }
    }
    loadLeaderboard();

    /*********************** Game Start Popup *************************/
    const popup = document.getElementById('namePopup');
    const startBtn = document.getElementById('startBtn');

    startBtn.addEventListener('click', () => {
      const nameInput = document.getElementById('playerNameInput').value.trim();
      if (!nameInput) return alert('Please enter your name');
      playerName = nameInput;
      popup.style.display = 'none';
      startGame();
    });

    /*********************** Game Logic (Simplified) *************************/
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = innerWidth;
    canvas.height = innerHeight;

    let playerScore = 0;
    let running = false;

    function startGame() {
      running = true;
      playerScore = 0;
      console.log("Game started for:", playerName);
      animate();
    }

    function animate() {
      if (!running) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Example placeholder gameplay (your existing game loop goes here)
      ctx.fillStyle = 'white';
      ctx.font = '18px Arial';
      ctx.fillText(`Player: ${playerName}`, 20, 40);
      ctx.fillText(`Score: ${playerScore}`, 20, 70);

      requestAnimationFrame(animate);
    }

    /*********************** Update Score in Sheet *************************/
    async function submitScore(newScore) {
      if (!playerName) return;

      try {
        // Check if player exists
        const response = await fetch(`${SHEET_API_URL}?Name=${encodeURIComponent(playerName)}`);
        const data = await response.json();

        if (data.length > 0) {
          const existing = data[0];
          const best = parseFloat(existing.BestScore || 0);
          if (newScore > best) {
            await fetch(SHEET_API_URL + `/Name/${encodeURIComponent(playerName)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ BestScore: newScore })
            });
          }
        } else {
          await fetch(SHEET_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ Name: playerName, BestScore: newScore })
          });
        }
        loadLeaderboard(); // refresh after update
      } catch (err) {
        console.error("Score update failed:", err);
      }
    }

    /*********************** Example: Call submitScore when game ends *************************/
    // Simulate game end after 10 seconds for demo
    setTimeout(() => {
      if (running) {
        running = false;
        playerScore = Math.floor(Math.random() * 300);
        console.log("Game ended with score:", playerScore);
        submitScore(playerScore);
      }
    }, 10000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Homework</title>
  <style>
    body {
      font-family: monospace;
      background: #0a0a0a;
      color: white;
      padding: 20px;
    }

    input {
      padding: 6px;
      margin: 4px 0;
      font-family: monospace;
    }

    button {
      padding: 6px;
      margin: 0px 0;
      font-family: monospace;
      background:transparent;
      class: invisible;
      border: none;
    }



    #links {
      display: none;
      margin-top: 15px;
      border-top: 1px solid #444;
      padding-top: 10px;
    }

    a {
      color: #6ee7b7;
      cursor: pointer;
      display: block;
      margin: 6px 0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>

  <!-- Password gate -->
  <input type="password" id="passwordInput" placeholder="Enter password">
  <button class="invisible" onclick="checkPassword()">unlock</button>
  <p id="msg" class="error"></p>

  <!-- Hidden link list -->
  <div id="links">
    <h3>Protected Links</h3>
    <a onclick="openEmbedded('https://elonduan.github.io/history-eraser/')">Double security</a>
    <a onclick="openEmbedded('https://pranx.com/hacker/')">Pranx Hacker</a>
    <a onclick="openEmbedded('https://duckmath.top')">DuckMaths</a>
    <a onclick="openEmbedded('https://elonduan.github.io/spaceship-shooting/')">spaceship</a>
    
  </div>

  <script>
    function checkPassword() {
      const pw = document.getElementById("passwordInput").value;
      const msg = document.getElementById("msg");

      if (pw === "technetium") {
        document.getElementById("links").style.display = "block";
        msg.textContent = "";
      } else {
        msg.textContent = "Wrong password";
      }
    }

    function openEmbedded(url) {
      const target = url.startsWith("http") ? url : "https://" + url;

      const newTab = window.open("about:blank", "_blank");

      newTab.document.write(`
        <iframe src="${target}"
                style="width:100vw; height:100vh; border:0;"></iframe>
      `);
      newTab.document.close();
    }
  </script>

</body>
</html>

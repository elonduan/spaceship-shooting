<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ball Shooter — 1v1 Online Duel</title>
<style>
html,body{margin:0;height:100%;background:black;color:white;overflow:hidden;font-family:sans-serif}
#ui{position:fixed;top:10px;left:10px;z-index:10}
textarea{width:320px;height:90px}
button{margin:4px 0}
#crosshair{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:white}
#crosshair:before{left:9px;top:0;width:2px;height:20px}
#crosshair:after{top:9px;left:0;width:20px;height:2px}
</style>
</head>

<body>
<div id="ui">
  <button onclick="createOffer()">Create Offer</button><br>
  <textarea id="offer"></textarea><br>
  <button onclick="setOffer()">Set Offer</button><br>
  <button onclick="createAnswer()">Create Answer</button><br>
  <textarea id="answer"></textarea><br>
  <button onclick="setAnswer()">Set Answer</button>
  <div>HP: <span id="hp">20</span> | Enemy HP: <span id="ehp">20</span></div>
</div>

<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>

<script>
/* -------------------- THREE SETUP -------------------- */
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

cam.position.z = 0;

scene.add(new THREE.AmbientLight(0xffffff, 1));

/* -------------------- PLAYER SHIPS -------------------- */
const shipGeo = new THREE.ConeGeometry(15,40,8);
const shipMat = new THREE.MeshStandardMaterial({color:0xffffff});
const enemyMat = new THREE.MeshStandardMaterial({color:0xff4444});

const playerShip = new THREE.Mesh(shipGeo, shipMat);
playerShip.rotation.x = Math.PI/2;
scene.add(playerShip);

const enemyShip = new THREE.Mesh(shipGeo, enemyMat);
enemyShip.rotation.x = Math.PI/2;
scene.add(enemyShip);

let playerHP = 20;
let enemyHP = 20;

/* -------------------- INPUT -------------------- */
const keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

/* -------------------- BULLETS -------------------- */
const bullets = [];
const enemyBullets = [];

function shoot(fromCam=true){
  const b = new THREE.Mesh(
    new THREE.SphereGeometry(2,8,8),
    new THREE.MeshBasicMaterial({color:fromCam?0xffff00:0x00ffff})
  );
  const dir = new THREE.Vector3(0,0,-1)
    .applyQuaternion(fromCam?cam.quaternion:enemyShip.quaternion)
    .normalize();
  b.position.copy(fromCam?cam.position:enemyShip.position);
  scene.add(b);
  (fromCam?bullets:enemyBullets).push({mesh:b,vel:dir.multiplyScalar(120)});
}

/* -------------------- WEBRTC -------------------- */
let pc, dc;

async function createPC(){
  pc = new RTCPeerConnection();
  dc = pc.createDataChannel("game");

  dc.onmessage = e => handleNet(JSON.parse(e.data));

  pc.ondatachannel = e=>{
    dc = e.channel;
    dc.onmessage = ev=>handleNet(JSON.parse(ev.data));
  };
}

async function createOffer(){
  await createPC();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  offerBox.value = JSON.stringify(offer);
}

async function setOffer(){
  await createPC();
  await pc.setRemoteDescription(JSON.parse(offerBox.value));
}

async function createAnswer(){
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  answerBox.value = JSON.stringify(ans);
}

async function setAnswer(){
  await pc.setRemoteDescription(JSON.parse(answerBox.value));
}

const offerBox = document.getElementById("offer");
const answerBox = document.getElementById("answer");

/* -------------------- NETWORK -------------------- */
function sendState(){
  if(!dc || dc.readyState!=="open") return;
  dc.send(JSON.stringify({
    t:"state",
    p:cam.position.toArray(),
    q:cam.quaternion.toArray(),
    hp:playerHP
  }));
}

function handleNet(m){
  if(m.t==="state"){
    enemyShip.position.fromArray(m.p);
    enemyShip.quaternion.fromArray(m.q);
    enemyHP = m.hp;
    document.getElementById("ehp").textContent = enemyHP;
  }
  if(m.t==="shoot") shoot(false);
}

/* -------------------- GAME LOOP -------------------- */
let lastNet = 0;

function animate(t){
  requestAnimationFrame(animate);

  if(keys.ArrowLeft) cam.rotateY(0.03);
  if(keys.ArrowRight) cam.rotateY(-0.03);
  if(keys.ArrowUp) cam.rotateX(0.03);
  if(keys.ArrowDown) cam.rotateX(-0.03);
  if(keys.Space){
    shoot(true);
    dc?.send(JSON.stringify({t:"shoot"}));
    keys.Space=false;
  }

  bullets.forEach((b,i)=>{
    b.mesh.position.add(b.vel.clone().multiplyScalar(0.016));
    if(b.mesh.position.distanceTo(enemyShip.position)<20){
      enemyHP--;
      scene.remove(b.mesh);
      bullets.splice(i,1);
    }
  });

  enemyBullets.forEach((b,i)=>{
    b.mesh.position.add(b.vel.clone().multiplyScalar(0.016));
    if(b.mesh.position.distanceTo(cam.position)<20){
      playerHP--;
      scene.remove(b.mesh);
      enemyBullets.splice(i,1);
    }
  });

  document.getElementById("hp").textContent = playerHP;

  if(t-lastNet>50){
    sendState();
    lastNet=t;
  }

  renderer.render(scene,cam);
}

animate();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ball Shooter (G-steer fix)</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#ddd;font-family:system-ui,-apple-system,Segoe UI,Roboto;overflow:hidden}
    #overlay{position:fixed;left:12px;top:12px;z-index:10;max-width:420px}
    .panel{background:rgba(0,0,0,0.45);padding:12px;border-radius:8px;backdrop-filter:blur(4px)}
    #win,#lose{display:none;padding:18px;margin-top:12px;border-radius:8px;font-weight:700}
    #win{background:linear-gradient(90deg,#0f0,#005500);color:#001}
    #lose{background:linear-gradient(90deg,#f00,#550000);color:#fff}
    #canvas-container{width:100%;height:100vh;display:block}
    input[type=range]{width:100%}
    label{font-size:13px;display:block;margin-top:10px}
    #crosshair{position:fixed;left:50%;top:50%;width:20px;height:20px;margin-left:-10px;margin-top:-10px;z-index:5;pointer-events:none}
    #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}
    #crosshair:before{left:9px;top:0;width:2px;height:20px}
    #crosshair:after{left:0;top:9px;width:20px;height:2px}
  </style>
</head>
<body>
  <div id="overlay">
    <div class="panel">
      <div><strong>Ball Shooter Competition — Made by Elon - 5 (fixed G)</strong></div>
      <ul style="margin:8px 0 0 18px;font-size:13px">
        <li>G: steer ship toward crosshair (hold) — fixed</li>
      </ul>
    </div>
  </div>
  <div id="canvas-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
  (function(){
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
    camera.position.set(0,0,0);

    // minimal star so scene isn't empty
    const geom = new THREE.BufferGeometry();
    const pos = new Float32Array(3);
    pos[0]=0; pos[1]=0; pos[2]=-1000;
    geom.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const pts = new THREE.Points(geom, new THREE.PointsMaterial({color:0xffffff, size:2}));
    scene.add(pts);

    function randomUnit(){
      const v = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
      return v.normalize();
    }

    const sphereRadius = 500;
    const enemySpeed = 3.0;
    const steerMin = 1000;
    const steerMax = 3000;
    const steerLerpFactor = 0.015;
    const maxRoll = 1.0;

    const MAX_ENEMIES = 2;
    const enemies = [];
    let selectedEnemyIndex = 0;

    function createEnemy(){
      const mat = new THREE.MeshNormalMaterial();
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(30,10,40), mat);
      const pos = randomUnit().multiplyScalar(sphereRadius * 0.4);
      const vel = randomUnit().multiplyScalar(enemySpeed);
      mesh.position.copy(pos);
      const enemy = {
        mesh,
        pos,
        vel,
        desiredVel: vel.clone(),
        nextSteerChange: performance.now() + steerMin + Math.random()*(steerMax - steerMin),
        prevVelDir: vel.clone().normalize(),
        hp: 10,
        shield: 8
      };
      scene.add(mesh);
      return enemy;
    }

    function ensureEnemies(){
      while(enemies.length < MAX_ENEMIES) enemies.push(createEnemy());
    }

    ensureEnemies();

    const keys = {};
    function pressKey(code){ keys[code] = true; }
    function releaseKey(code){ keys[code] = false; }

    window.addEventListener('keydown',(e)=>{ pressKey(e.code); });
    window.addEventListener('keyup',(e)=>{ releaseKey(e.code); });

    function alignShipToVelocity(enemy, t = 0.35){
      if(!enemy || !enemy.mesh) return;
      if(enemy.vel.lengthSq() < 1e-6) return;
      const velDir = enemy.vel.clone().normalize();
      // simple orientation: point the model toward velDir using lookAt
      const target = enemy.mesh.position.clone().add(velDir);
      enemy.mesh.lookAt(target);
    }

    // --- FIXED stepEnemy (G steering) ---
    function stepEnemy(enemy, dt, isPrimary){
      if (!enemy || !enemy.mesh) return;

      // When primary and G is held, smoothly steer toward the camera's forward ray (crosshair)
      if (isPrimary && keys['KeyG'] && camera) {
        // compute a target point far ahead of the camera along its forward direction
        const camForward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize();
        const targetPoint = camera.position.clone().add(camForward.clone().multiplyScalar(800));

        // desired velocity is the direction from enemy -> targetPoint at enemySpeed
        const desiredDir = targetPoint.clone().sub(enemy.pos);
        const dist = desiredDir.length();
        if (dist > 1e-4) {
          const desiredVel = desiredDir.normalize().multiplyScalar(enemySpeed);

          // use a stronger lerp factor when steering toward the crosshair so it's responsive
          const steerStrength = Math.min(1, 0.18 * (dt * 60));
          enemy.vel.lerp(desiredVel, steerStrength);

          // keep desiredVel for fallback/continuity
          enemy.desiredVel.copy(desiredVel);
        }
      } else {
        // normal wandering behaviour
        if(performance.now() > enemy.nextSteerChange){
          enemy.desiredVel = randomUnit().multiplyScalar(enemySpeed);
          enemy.nextSteerChange = performance.now() + steerMin + Math.random()*(steerMax - steerMin);
        }
        enemy.vel.lerp(enemy.desiredVel, Math.min(1, steerLerpFactor * (dt*60)));
      }

      // ensure velocity has consistent magnitude and move
      if (enemy.vel.lengthSq() < 1e-6) enemy.vel.copy(enemy.desiredVel || new THREE.Vector3(0,0,1).multiplyScalar(enemySpeed));
      enemy.vel.setLength(enemySpeed);
      enemy.pos.add(enemy.vel.clone().multiplyScalar(dt * 60));

      // keep enemies on the sphere
      const distFromOrigin = enemy.pos.length();
      if(distFromOrigin >= sphereRadius){
        const normal = enemy.pos.clone().normalize();
        enemy.pos.copy(normal.clone().multiplyScalar(sphereRadius - 1));
        const v = enemy.vel.clone();
        const dot = v.dot(normal);
        const reflected = v.clone().sub(normal.clone().multiplyScalar(2*dot));
        enemy.vel.copy(reflected.setLength(enemySpeed));
        enemy.desiredVel.copy(enemy.vel);
      }

      enemy.mesh.position.copy(enemy.pos);
      alignShipToVelocity(enemy, 0.25);
    }

    let last = performance.now();
    function animate(t){
      requestAnimationFrame(animate);
      const now = t || performance.now();
      const dt = Math.min((now - last)/1000, 0.1);
      last = now;

      ensureEnemies();
      enemies.forEach((e, idx) => stepEnemy(e, dt, idx === selectedEnemyIndex));

      renderer.render(scene, camera);
    }

    animate();

    // simple camera rotate with arrow keys so you can aim the crosshair
    window.addEventListener('keydown',(e)=>{
      if(e.code === 'ArrowLeft') camera.rotateY(0.05);
      if(e.code === 'ArrowRight') camera.rotateY(-0.05);
      if(e.code === 'ArrowUp') camera.rotateX(0.04);
      if(e.code === 'ArrowDown') camera.rotateX(-0.04);
    });

    window.addEventListener('resize',()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  })();
  </script>
</body>
</html>
